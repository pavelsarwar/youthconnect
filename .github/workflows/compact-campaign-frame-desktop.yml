name: Compact Campaign Frame Desktop
on:
  push:
    branches: [main]
    paths: ['.github/workflows/compact-campaign-frame-desktop.yml']
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fit Campaign Frame workspace within desktop viewport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('campaign-frame/index.html')
          s=p.read_text(encoding='utf-8')
          css='''
@media(min-width:1141px){
  .page-hero{padding:132px 0 38px}
  .page-hero .eyebrow{margin-bottom:12px}
  .page-hero h1{font-size:clamp(38px,3.4vw,52px);margin-bottom:8px}
  .page-hero p{font-size:13px;line-height:1.55;max-width:700px}
  .workspace{padding:24px 0 30px}
  .grid{grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
  .preview-card,.controls{padding:16px;border-radius:20px}
  .preview-card h2,.controls h2{font-size:22px;margin-bottom:4px}
  .sub{font-size:11px;line-height:1.45;margin-bottom:10px}
  .canvas-wrap{width:min(100%,520px);margin:0 auto;border-radius:16px}
  .hint{font-size:10px;margin-top:8px}
  .upload{min-height:44px;border-radius:12px;font-size:12px}
  .field{margin-top:12px}
  .field label{font-size:11px;margin-bottom:6px}
  .field select{padding:10px 11px;border-radius:11px;font-size:12px}
  .range-row{gap:8px}
  .tools{gap:7px;margin-top:12px}
  .tool{padding:9px;border-radius:11px;font-size:11px}
  .download{margin-top:12px;min-height:46px;border-radius:12px;font-size:12px}
  .privacy{margin-top:10px;font-size:9.5px;line-height:1.35}
  .frame-note{margin-top:9px;padding:9px 10px;border-radius:10px;font-size:9.5px;line-height:1.35}
}
@media(min-width:1141px) and (max-height:820px){
  .page-hero{padding:124px 0 28px}
  .workspace{padding:18px 0 24px}
  .canvas-wrap{width:min(100%,455px)}
  .preview-card,.controls{padding:14px}
  .frame-note{display:none}
}
'''
          marker='</style>'
          if 'Fit Campaign Frame workspace within desktop viewport' in s:
              pass
          elif marker in s:
              s=s.replace(marker,css+marker,1)
          else:
              raise SystemExit('style closing tag not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate compact desktop CSS
        run: |
          grep -q '@media(min-width:1141px)' campaign-frame/index.html
          grep -q 'width:min(100%,520px)' campaign-frame/index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campaign-frame/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Compact Campaign Frame desktop workspace'
            git push
          fi